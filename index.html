<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Panel Grid Calculator</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #e0f7fa, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-top: 30px;
      color: #00796b;
      font-size: 2em;
      text-shadow: 1px 1px #ccc;
    }

    .container {
      background: #ffffff;
      border-radius: 15px;
      padding: 20px 30px;
      margin-top: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      max-width: 700px;
      width: 90%;
    }

    label {
      display: inline-block;
      width: 150px;
      text-align: right;
      margin-right: 10px;
      font-weight: 500;
    }

    input[type=number] {
      width: 100px;
      padding: 5px;
      margin: 5px 0 15px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      outline: none;
      transition: border 0.2s;
    }

    input[type=number]:focus {
      border: 2px solid #00796b;
    }

    button {
      background-color: #00796b;
      color: #fff;
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #004d40;
    }

    #solarCanvas {
      border-radius: 10px;
      margin-top: 20px;
      max-width: 100%;
      height: auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    #energyOutput {
      margin-top: 20px;
      font-weight: 700;
      font-size: 1.2em;
      color: #004d40;
    }

    /* Responsive for mobile */
    @media(max-width: 600px) {
      label {
        width: 100%;
        text-align: left;
        margin-bottom: 5px;
      }

      input[type=number] {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h1>Solar Panel Grid Calculator</h1>

  <div class="container">
    <div>
      <label>Width of area (m): </label>
      <input type="number" id="width" value="5" min="1"><br>

      <label>Height of area (m): </label>
      <input type="number" id="height" value="3" min="1"><br>

      <label>Panel width (m): </label>
      <input type="number" id="panelWidth" value="1" min="0.1" step="0.1"><br>

      <label>Panel height (m): </label>
      <input type="number" id="panelHeight" value="2" min="0.1" step="0.1"><br>

      <button onclick="drawGrid()">Generate Grid</button>
    </div>

    <canvas id="solarCanvas" width="600" height="400"></canvas>
    <div id="energyOutput"></div>
  </div>

  <script>
    function drawGrid() {
      const width = parseFloat(document.getElementById('width').value);
      const height = parseFloat(document.getElementById('height').value);
      const panelWidth = parseFloat(document.getElementById('panelWidth').value);
      const panelHeight = parseFloat(document.getElementById('panelHeight').value);

      const canvas = document.getElementById('solarCanvas');
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cols = Math.floor(width / panelWidth);
      const rows = Math.floor(height / panelHeight);
      const totalPanels = cols * rows;

      const cellWidth = canvas.width / (cols || 1); // prevent division by 0
      const cellHeight = canvas.height / (rows || 1);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          ctx.fillStyle = '#4CAF50';
          ctx.fillRect(c * cellWidth + 2, r * cellHeight + 2, cellWidth - 4, cellHeight - 4);
        }
      }

      const energyPerPanel = 0.3; // kW
      const sunHoursPerDay = 5; // hours
      const dailyEnergy = totalPanels * energyPerPanel * sunHoursPerDay;

      document.getElementById('energyOutput').innerHTML =
        `Panels: ${totalPanels} <br>Estimated Daily Energy: ${dailyEnergy.toFixed(2)} kWh`;
    }
  </script>

</body>
</html>
