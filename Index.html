<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solar Panel Grid Calculator</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #e0f7fa, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-top: 30px;
      color: #00796b;
      font-size: 2em;
      text-shadow: 1px 1px #ccc;
    }

    .container {
      background: #ffffff;
      border-radius: 15px;
      padding: 20px 30px;
      margin-top: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      max-width: 900px;
      width: 90%;
    }

    label {
      display: inline-block;
      width: 170px;
      text-align: right;
      margin-right: 10px;
      font-weight: 500;
    }

    input[type=number] {
      width: 100px;
      padding: 5px;
      margin: 5px 0 15px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      outline: none;
      transition: border 0.2s;
    }

    input[type=number]:focus {
      border: 2px solid #00796b;
    }

    button {
      background-color: #00796b;
      color: #fff;
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #004d40;
    }

    #solar3D {
      width: 100%;
      height: 500px;
      margin-top: 20px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      background: linear-gradient(to top, #c8e6c9, #e3f2fd);
    }

    #energyOutput {
      margin-top: 20px;
      font-weight: 700;
      font-size: 1.2em;
      color: #004d40;
    }

    @media(max-width: 600px) {
      label {
        width: 100%;
        text-align: left;
        margin-bottom: 5px;
      }

      input[type=number] {
        width: 100%;
      }

      #solar3D {
        height: 350px;
      }
    }
  </style>
</head>
<body>

  <h1>Solar Panel Grid Calculator</h1>

  <div class="container">

    <div>
      <label>Width of area (m): </label>
      <input type="number" id="width" value="5" min="1"><br>

      <label>Height of area (m): </label>
      <input type="number" id="height" value="3" min="1"><br>

      <label>Panel width (m): </label>
      <input type="number" id="panelWidth" value="1" min="0.1" step="0.1"><br>

      <label>Panel height (m): </label>
      <input type="number" id="panelHeight" value="2" min="0.1" step="0.1"><br>

      <button onclick="drawGrid()">Generate 3D Grid</button>
    </div>

    <!-- 3D Scene -->
    <div id="solar3D"></div>

    <div id="energyOutput"></div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let panelGroup;

    initScene();
    drawGrid();

    function initScene() {
      const container = document.getElementById('solar3D');

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        60,
        container.clientWidth / container.clientHeight,
        0.1,
        1000
      );

      camera.position.set(8, 8, 12);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.shadowMap.enabled = true;

      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
      directionalLight.position.set(10, 20, 10);
      directionalLight.castShadow = true;
      scene.add(directionalLight);

      // Ground
      const groundGeometry = new THREE.PlaneGeometry(50, 50);
      const groundMaterial = new THREE.MeshStandardMaterial({
        color: 0xb2dfdb
      });

      const ground = new THREE.Mesh(groundGeometry, groundMaterial);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      animate();

      window.addEventListener('resize', onWindowResize);
    }

    function drawGrid() {

      const width = parseFloat(document.getElementById('width').value);
      const height = parseFloat(document.getElementById('height').value);
      const panelWidth = parseFloat(document.getElementById('panelWidth').value);
      const panelHeight = parseFloat(document.getElementById('panelHeight').value);

      const cols = Math.floor(width / panelWidth);
      const rows = Math.floor(height / panelHeight);
      const totalPanels = cols * rows;

      // Remove old panels
      if (panelGroup) {
        scene.remove(panelGroup);
      }

      panelGroup = new THREE.Group();

      // Solar panel material
      const panelMaterial = new THREE.MeshStandardMaterial({
        color: 0x1565c0,
        metalness: 0.5,
        roughness: 0.3
      });

      const frameMaterial = new THREE.MeshStandardMaterial({
        color: 0x444444
      });

      const spacing = 0.15;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {

          // Panel surface
          const panelGeometry = new THREE.BoxGeometry(
            panelWidth,
            0.08,
            panelHeight
          );

          const panel = new THREE.Mesh(panelGeometry, panelMaterial);

          panel.position.x =
            c * (panelWidth + spacing);

          panel.position.z =
            r * (panelHeight + spacing);

          panel.position.y = 0.6;

          // Tilt the panel slightly
          panel.rotation.x = -0.35;

          panel.castShadow = true;
          panel.receiveShadow = true;

          // Frame/stand
          const standGeometry = new THREE.BoxGeometry(
            panelWidth * 0.9,
            0.5,
            0.08
          );

          const stand = new THREE.Mesh(standGeometry, frameMaterial);

          stand.position.set(
            panel.position.x,
            0.25,
            panel.position.z
          );

          panelGroup.add(panel);
          panelGroup.add(stand);
        }
      }

      // Center the grid
      panelGroup.position.x =
        -(cols * (panelWidth + spacing)) / 2;

      panelGroup.position.z =
        -(rows * (panelHeight + spacing)) / 2;

      scene.add(panelGroup);

      // Energy calculations
      const energyPerPanel = 0.3; // kW
      const sunHoursPerDay = 5; // hours

      const dailyEnergy =
        totalPanels * energyPerPanel * sunHoursPerDay;

      document.getElementById('energyOutput').innerHTML =
        `Panels: ${totalPanels}<br>
         Estimated Daily Energy:
         ${dailyEnergy.toFixed(2)} kWh`;
    }

    function animate() {
      requestAnimationFrame(animate);

      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      const container = document.getElementById('solar3D');

      camera.aspect =
        container.clientWidth / container.clientHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        container.clientWidth,
        container.clientHeight
      );
    }
  </script>

</body>
</html>
